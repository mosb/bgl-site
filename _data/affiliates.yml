# Bayesian Governance Lab – affiliates
# Rendered as a compact list on the People page (/people/), between the
# member cards and the alumni. Affiliates are researchers whose home is
# another group but who take part in the lab's meetings and tutorials.
# The page sorts them by surname when it renders.
#
# The source of truth for who is an affiliate is the register:
#
#     ~/Documents/AIGI_BGL/members/affiliates.csv
#
# Only people whose Status there is Active AND whose Website column says Yes
# belong in this file: nobody is listed without having agreed to it. When an
# affiliation lapses, remove the entry. Affiliates do not move to alumni.yml,
# which is for former students and postdocs of the lab.
#
# Fields:
#   name         (required)  Full name, as it should display.
#   role         (required)  DPhil student, Postdoctoral researcher, 4YP
#                            student, and so on.
#   affiliation  (required)  Home department or institute, and the group or
#                            supervisor if we have it, in one short phrase.
#   start                    Year the affiliation began. Omit if it reads
#                            oddly; the list says "from 2026" when set.
#   end                      Year it ended. In practice, remove the entry.
#   website                  One link, and only if it has been checked
#                            recently. A dead link is worse than none.

