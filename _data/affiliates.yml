# Bayesian Governance Lab – affiliates
# Rendered as cards on the People page (/people/), in the same style as the
# members, under their own heading between the members and the alumni.
# Affiliates are researchers whose home is another Oxford group but who take
# part in the lab's meetings and tutorials. List order is display order.
#
# The source of truth for who is an affiliate is the register:
#
#     ~/Documents/AIGI_BGL/members/affiliates.csv
#
# Only people whose Status there is Active AND whose Website column says Yes
# belong in this file: nobody is listed without having agreed to it. When an
# affiliation lapses, remove the entry. Affiliates do not move to alumni.yml,
# which is for former students and postdocs of the lab.
#
# Fields are those of members.yml (name, role, status, image, blurb, links),
# plus:
#   affiliation  (required)  Home department or institute, shown after the
#                            role. Name the group or supervisor in the blurb.
#
# The blurbs below were drafted from public pages in October 2026 and use no
# pronouns. Each affiliate is asked to correct or replace their own before
# the entry goes live.

- name: Emma Finn
  role: DPhil student
  affiliation: Department of Statistics
  image: emma-finn.jpg
  blurb: >-
    Works on the mathematics of diffusion models and on interpretable
    generative models, with the aim of understanding generative AI well enough
    to make it safer. Supervised by Yee Whye Teh and Patrick Rebeschini; a
    Rhodes Scholar, with degrees in Mathematics, Classics and Statistics from
    Harvard.
  links:
    website: https://emmafinn314.github.io/
    email: emma.finn@sjc.ox.ac.uk

- name: Teodora Reu
  role: DPhil student
  affiliation: Department of Computer Science
  image: teodora-reu.jpg
  blurb: >-
    Works on the theory of generative models: diffusion, flow matching and
    optimal transport, and geometric deep learning, with a growing interest in
