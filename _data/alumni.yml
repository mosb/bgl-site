#   name    (required)  Full name, as it should display.
#   role    (required)  DPhil, MSc(Res) or Postdoc.
#   start              Year they joined the lab.
#   end                Year they left. Omit if we have no leaving year:
#                      the entry then reads "from 2012" rather than a range.
#   website            One link, and only if it has been checked recently.
#                      A dead link is worse than none.

