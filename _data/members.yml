# Bayesian Governance Lab – members
# SINGLE SOURCE OF TRUTH. To add a person, copy one block and fill it in.
# Nothing else to edit: the People page (/people/) renders this list as cards,
# and list order is display order, so the director stays first.
#
# Fields:
#   name   (required)  Full name, as it should display.
#   role   (required)  Short label: Lab Lead, Postdoctoral Researcher, or the
#                      year of entry for a student.
#   group              Section heading to open before this person. Repeat the
#                      same string on consecutive people to keep them in one
#                      section; omit it to stay in the section above.
#   image              Filename in assets/img/ (a square photo crops best).
#                      Omit for a neutral placeholder tile.
#   blurb              1–3 sentences. Markdown (links, emphasis) is fine.
#   links              Any of website / scholar / github / email. Omit unused.

- name: Maike Osborne
  role: Lab Lead
  group: Research staff
  image: maike.jpg
  blurb: >-
    Professor of Machine Learning at Oxford and co-director of the Oxford Martin
    AI Governance Initiative. Her work brings Bayesian machine learning and
    probabilistic numerics to bear on making AI systems trustworthy and
    governable.
  links:
    website: https://www.robots.ox.ac.uk/~mosb
    scholar: https://scholar.google.com/citations?user=iTNcAakAAAAJ
    email: maike.osborne@eng.ox.ac.uk

- name: Rivka MacLaine Mitchell
  role: Postdoctoral Researcher
  image: rivka.jpg
  blurb: >-
    Postdoctoral researcher bringing probability theory to the assurance and
    governance of AI. Her background is in random processes on graphs and
    Markov chain Monte Carlo, developed through a DPhil in Mathematics at
    Oxford, and now directed towards modelling the causal structure and
    behaviour of AI systems.

  links:
    website: https://rivkamitchell.github.io/
    scholar: https://scholar.google.com/citations?user=NCFdDyUAAAAJ
    email: rivka.mitchell@oxfordmartin.ox.ac.uk


# The student blurbs below were drafted from public sources, and deliberately
# use no pronouns. Each student should be given the chance to correct or
# replace their own.

- name: Juliusz Ziomek
  role: 2023 entry
  group: Research students
  image: juliusz-ziomek.jpg
  blurb: >-
    Works on Bayesian optimisation, and in particular on what to do when the
    structure of the objective or the kernel hyperparameters are not known in
    advance. Came to Oxford from Huawei's London research lab.
  links:
    website: https://juliuszziomek.github.io/
    email: juliusz.ziomek@univ.ox.ac.uk

- name: Lucas Schorling
  role: 2023 entry
  blurb: >-
    Applies machine learning to the characterisation and tuning of quantum
    devices, where the number of parameters puts manual tuning out of reach.
    Also works on optimisers for training deep networks.
  links:
    email: lucas.schorling@stcatz.ox.ac.uk

- name: Aidan O'Gara
  role: 2024 entry
  blurb: >-
    Works on the technical side of AI governance, most recently on
    hardware-enabled mechanisms: AI chips designed to enforce rules on their
    own use and to resist tampering. Earlier work covered deception in
    language models and gaps in export controls.
  links:
    website: https://aigi.ox.ac.uk/people/aidan-ogara/

- name: Benjamin Bucknall
  role: 2024 entry
  image: benjamin-bucknall.jpg
  blurb: >-
    Studies what access to AI systems external researchers and evaluators
    need in order to do their work, and how technical expertise can be brought
    into policy-making. Co-author of *Open Problems in Technical AI
    Governance*, and an adviser to the UK government on AI risk management.
  links:
    website: https://www.robots.ox.ac.uk/~bucknall/
    email: benjamin.bucknall@new.ox.ac.uk

- name: Clarisse Wibault
  role: 2024 entry
  image: clarisse-wibault.jpg
  blurb: >-
    Works on offline reinforcement learning: drawing useful policies out of
    large fixed datasets, and using what those policies reveal to guide which
    data to collect next. Co-supervised by Jakob Foerster.
  links:
    website: https://clarisse-wibault.github.io/clarissewibault/
    email: clarisse.wibault@magd.ox.ac.uk

- name: George Whittle
  role: 2024 entry
  blurb: >-
    Works on approximate inference in deep learning, and applies it to the
    control and measurement of quantum devices. Co-supervised by Natalia
    Ares.
  links:
    scholar: https://scholar.google.com/citations?user=cTqFrdgAAAAJ
    email: george.whittle@reuben.ox.ac.uk

- name: Timothy Fist
  role: 2024 entry
  image: timothy-fist.jpg
  blurb: >-
    Researches the security of AI chips, and how compute serves as a lever for
    governing AI development. Director of Emerging Technology Policy at the
    Institute for Progress.
  links:
    website: https://aigi.ox.ac.uk/people/tim-fist/
    email: timothy.fist@stcatz.ox.ac.uk

- name: Avi Semler
  role: 2025 entry
  image: avi-semler.jpg
  blurb: >-
    Works on whether a model's stated chain of thought reflects the computation
    that produced its answer, and on verifying what a training set actually
    contains. Part of the AIMS CDT.
  links:
    website: https://avisemler.github.io/
    email: avi.semler@worc.ox.ac.uk

- name: Lucas Irwin
  role: 2025 entry
  image: lucas-irwin.jpg
  blurb: >-
    Works on AI governance and on how far safety training in language models
    generalises, including to prompts that are semantically close to those it
    was trained against.
  links:
    website: https://aigi.ox.ac.uk/people/lucas-irwin/
    email: lucas.irwin@stcatz.ox.ac.uk

- name: Mauricio Baker
  role: 2025 entry
  image: mauricio-baker.jpg
  blurb: >-
    Works on how AI-specialised hardware could be overseen, so that states can
    verify each other's compliance with agreements on AI development. A
    Technology and Security Policy Fellow at RAND.
  links:
    website: https://aigi.ox.ac.uk/people/mauricio-baker/
    email: mauricio.baker@exeter.ox.ac.uk

- name: Michael Chen
  role: 2025 entry
  image: michael-chen.jpg
  blurb: >-
    Works on frontier safety policies and the evaluations they rest on. On the
    policy team at METR, advising AI companies and commenting on emerging
    regulation in the US and EU.
  links:
    website: https://miclchen.com/
    email: michael.chen@linacre.ox.ac.uk

- name: Mike Wharton
  role: 2025 entry
  image: mike-wharton.jpg
  blurb: >-
    Works on how people interact with automated systems, with interests
    spanning robotics, nuclear reactor engineering, quantum computing and the
    social sciences. Came to the DPhil from an MEng in mechanical engineering
    at Bristol, by way of a spell as a trainee patent attorney. Part of the
    AIMS CDT.
  links:
    email: mike.wharton@eng.ox.ac.uk

- name: Tom Bush
  role: 2025 entry
  image: tom-bush.jpg
  blurb: >-
    Works on interpretability, and on what reinforcement learning agents come
    to do internally, including the first mechanistic evidence that a
    model-free agent can learn to plan. Part of the AIMS CDT.
  links:
    website: https://tuphs28.github.io/
    email: thomas.bush@linacre.ox.ac.uk

- name: Akash Agrawal
  role: 2026 entry
  image: akash-agrawal.jpg
  blurb: >-
    Works on multi-agent security: how deception and coordination arise
    between AI agents, and what protocols make their interactions safe. Holds
    a Cooperative AI PhD Fellowship.
  links:
    scholar: https://scholar.google.com/citations?user=YiD9MwQAAAAJ

- name: Alexandre Duplessis
  role: 2026 entry
  blurb: >-
    Works on interpretability and on the robustness and geometry of neural
    networks. Joins the lab from the ENS in Paris.
  links:
    scholar: https://scholar.google.com/citations?user=A6U6ZM4AAAAJ

- name: Patricia Paskov
  role: 2026 entry
  image: patricia-paskov.jpg
  blurb: >-
    Works on the science of frontier AI evaluations: what makes an evaluation
    rigorous enough to carry the claims made from it. Director of Standards at
    AVERI and an adjunct researcher at RAND.
  links:
    website: https://www.prpaskov.com/
    email: patricia.paskov@st-hildas.ox.ac.uk

- name: Tung-Yu Wu
  role: 2026 entry
  image: tung-yu-wu.jpg
  blurb: >-
    Works on interpretability, including methods that produce natural-language
    explanations of what individual neurons in a network respond to.
  links:
    scholar: https://scholar.google.com/citations?user=Zx1YxFgAAAAJ

